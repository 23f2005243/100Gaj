services:
  - type: web
    name: 100gaj
    env: node
    plan: free
    buildCommand: "npm install && npm install --prefix client && npm run build --prefix client"
    startCommand: "node api/index.js"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: CLIENT_ORIGIN
        value: "https://100gajestate.netlify.app"
