services:
  - type: web
    name: 100gaj
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node api/index.js"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: CLIENT_ORIGIN
        value: "https://100gajestate.vercel.app/,http://localhost:5173"
